name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install rsync and PHP CLI
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync php-cli
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Build and inspect wheel
        run: |
          uv build
          python3 -m zipfile -l dist/*.whl | grep -q 'yourls_manager/php/ym-helper.php'
